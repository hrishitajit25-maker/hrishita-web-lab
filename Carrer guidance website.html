/* =========================================================
   RECOMMENDATION ENGINE
========================================================= */

function calculateRecommendations(p){

    let score = {};

    careers.forEach(c=>score[c.id]=0);

    p.interests.forEach(i=>{
        careers.forEach(c=>{
            if(c.interests.includes(i)){
                score[c.id]+=3;
            }
        });
    });

    p.skills.forEach(s=>{
        careers.forEach(c=>{
            if(c.skills.includes(s)){
                score[c.id]+=2;
            }
        });
    });

    p.goals.forEach(g=>{
        careers.forEach(c=>{
            if(c.goals.includes(g)){
                score[c.id]+=6;
            }
        });
    });

    let max=Math.max(...Object.values(score),1);

    return careers
        .map(c=>({
            ...c,
            score:score[c.id],
            match:Math.min(98,Math.round(48+(score[c.id]/max)*50))
        }))
        .sort((a,b)=>b.score-a.score)
        .slice(0,3);
}

function multiOptions(arr,key){

${arr.map(x=>`

<div
onclick="toggleOption('${key}','${x}')"
class="option ${formData[key].includes(x)?'active':''}">
${x}
${formData[key].includes(x)?" ✓":""}
</div>

`).join("")}

</div>`;

}

function selectSingle(key,value){

function toggleOption(key,value){

if(formData[key].includes(value)){
    formData[key]=formData[key].filter(x=>x!==value);
}else{

}

function roadmapPage(){

if(!selectedCareer){

return emptyPage(
"No roadmap selected",
"Choose a career first.",
"careers"
);

}

let roadmap=selectedCareer.roadmap;

let completed=roadmap.filter((x,i)=>
roadmapProgress[selectedCareer.id+"-"+i]
).length;

let percent=Math.round(completed/roadmap.length*100);

return `

<div class="space-y-7">

<div>

<div class="flex justify-between">

<div>

<div class="text-xs text-yellow-300 font-bold uppercase tracking-widest">
🗺️ PERSONALIZED ROADMAP
</div>

<h1 class="text-4xl font-black mt-2">
${selectedCareer.name}
</h1>

</div>

<div class="text-right">

<div class="text-3xl font-black text-yellow-300">
${percent}%
</div>

<div class="text-xs text-slate-500">
ROADMAP PROGRESS
</div>

</div>

</div>

<div class="progress mt-5">
<div style="width:${percent}%"></div>
</div>

</div>


<div class="space-y-4">

${roadmap.map((p,i)=>{

let done=roadmapProgress[selectedCareer.id+"-"+i];

return `

<div class="glass rounded-2xl p-6">

<div class="flex gap-4">

<button onclick="togglePhase('${selectedCareer.id}',${i})"
class="text-2xl">

${done?"✅":"⭕"}

</button>

<div class="flex-1">

<div class="flex flex-wrap gap-2">

<span class="text-xs bg-purple-500/10 text-purple-300 px-2 py-1 rounded-lg">
PHASE ${i+1}
</span>

<span class="text-xs text-slate-500">
⏱ ${p[2]}
</span>

</div>

<h2 class="text-xl font-black mt-3 ${done?'line-through text-slate-500':''}">
${p[0]}
</h2>

<div class="flex flex-wrap gap-2 mt-3">

${p[1].map(s=>
`<span class="text-xs bg-white/5 px-2 py-1 rounded-lg">${s}</span>`
).join("")}

</div>

<p class="text-sm text-slate-400 mt-4">
<b class="text-white">Learning Objective:</b>
${p[3]}
</p>

<p class="text-sm text-slate-400 mt-2">
<b class="text-white">Project Idea:</b>
${p[4]}
</p>

</div>

</div>

</div>

`;

}).join("")}

</div>

`;

}

function togglePhase(id,index){

let key=id+"-"+index;

roadmapProgress[key]=!roadmapProgress[key];

saveProgress(roadmapProgress);

render();

}

let chatMessages=JSON.parse(
localStorage.getItem("careerChat")||"[]"

function assistantPage(){

Ask questions about careers, skills, projects and internships.
</p>

</div>


<div class="glass rounded-3xl overflow-hidden">

<div class="border-b border-white/10 p-5">

<div class="font-bold">
CareerGuide AI
</div>

<div class="text-xs text-emerald-300">
● Demo assistant online
</div>

</div>


<div id="chatBox"
class="p-5 h-[430px] overflow-y-auto space-y-4">

${chatMessages.length===0?`

<div class="text-center py-16">

<div class="text-5xl">
🤖
</div>

<h2 class="font-black text-xl mt-4">
What can I help you figure out?
</h2>

<p class="text-sm text-slate-500 mt-2">
Try a question below.
</p>

<div class="grid sm:grid-cols-2 gap-2 mt-6">

${[
"What should I learn next?",
"Can I become an AI engineer?",
"What projects should I build?",
"How should I prepare for internships?"
].map(q=>`

<button onclick="sendChat('${q}')"
class="bg-white/5 border border-white/10 rounded-xl p-3 text-xs text-left">
${q}
</button>

`).join("")}

</div>

</div>

`:""}

${chatMessages.map(m=>`

<div class="flex ${m.role==="user"?"justify-end":""}">

<div class="max-w-[80%] rounded-2xl px-4 py-3 text-sm
${m.role==="user"?"bg-purple-500/20":"bg-white/5"}">

${m.text}

</div>

</div>

`).join("")}

</div>


<form onsubmit="event.preventDefault();sendChat()"
class="border-t border-white/10 p-4 flex gap-2">

<input
id="chatInput"
placeholder="Ask about your career..."
class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none">

<button
class="bg-yellow-300 text-black rounded-xl px-5 font-black">
Send
</button>

</form>

</div>

</div>

`;

}

function sendChat(question){

let input=document.getElementById("chatInput");

let text=question || input?.value;

if(!text || !text.trim()) return;

text=text.trim();

chatMessages.push({
role:"user",
text:text
});

let reply=getAIResponse(text);

chatMessages.push({
role:"assistant",
text:reply
});

localStorage.setItem(
"careerChat",
JSON.stringify(chatMessages)
);

render();

setTimeout(()=>{

let box=document.getElementById("chatBox");

if(box) box.scrollTop=box.scrollHeight;

},50);

}

function getAIResponse(q){

q=q.toLowerCase();

let careerName=selectedCareer?.name || "your target career";

if(q.includes("next") || q.includes("learn")){

let nextSkill=selectedCareer?.roadmap?.[0]?.[1]?.[0] || "programming fundamentals";

return `Based on your profile, I recommend learning <b>${nextSkill}</b> next. After that, build a small project and then move to the next roadmap phase.`;

}

if(q.includes("project")){

let project=selectedCareer?.projects?.[0] || "a portfolio project";

return `For ${careerName}, a good starting project is <b>${project}</b>. Keep it small, document your learning, and publish the final result on GitHub.`;

}

if(q.includes("intern")){

return `For internships, focus on three things: <b>2–3 good projects, strong fundamentals and a clear resume</b>. Keep your GitHub updated and practice interview questions regularly.`;

}

if(q.includes("ai engineer") || q.includes("become")){

return `Yes. You can work toward ${careerName}. Your current profile is only a starting point. Focus on the missing skills, complete projects and keep improving consistently.`;

}

if(q.includes("skill")){

return `Your selected path is <b>${careerName}</b>. Start with the missing foundational skills shown in Skill Gap, then move into projects and deployment.`;

}

return `I can help you with career choices, learning plans, skill gaps, projects, internships and interview preparation. Based on your profile, I recommend focusing on <b>${careerName}</b>.`;

}

"Artificial Intelligence",
"Coding",
"Problem Solving"
],

"Python",

],

],

/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

if(currentPage==="landing"){

document.getElementById("app").innerHTML=
landingPage();

return;

}

let content="";

switch(currentPage){

case"dashboard":
content=dashboardPage();
break;

case"assessment":
content=assessmentPage();
break;

case"careers":
content=careersPage();
break;

case"skillgap":
content=skillGapPage();
break;

case"roadmap":
content=roadmapPage();
break;

case"projects":
content=projectsPage();
break;

case"assistant":
content=assistantPage();
break;

case"compare":
content=comparePage();
break;

default:
content=dashboardPage();

}

document.getElementById("app").innerHTML=`

${sidebar()}

<div class="lg:pl-72 min-h-screen">

${topbar()}

${mobileMenu()}

<main class="max-w-[1500px] mx-auto p-4 md:p-8 fade">

${content}

</main>

<footer class="border-t border-white/10 text-center py-6 text-xs text-slate-600">

CareerGuide AI · Hackathon MVP ·
<button onclick="resetData()" class="text-slate-500 hover:text-white">
Reset Local Data
</button>

</footer>

</div>

`;

if(currentPage==="compare"){

setTimeout(renderComparison,10);

}

}

/* =========================================================
   CAREER SELECT
========================================================= */

function selectCareer(id,page){

selectedCareer=careers.find(c=>c.id===id);

if(profile){

profile.selectedCareer=id;

saveProfile(profile);

}

navigate(page);

}

/* =========================================================
   RESET
========================================================= */

function resetData(){

if(confirm("Reset all CareerGuide AI data?")){

localStorage.clear();

profile=null;
recommendations=[];
selectedCareer=null;
roadmapProgress={};
chatMessages=[];

currentPage="landing";

render();

}

}

/* =========================================================
   START
========================================================= */

render();
